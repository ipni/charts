apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "relayx.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "relayx.labels" . | nindent 4 }}
data:
  {{ .Values.pebbleOptions.fileName }}: {{ required "pebbleOptions.content is required" .Values.pebbleOptions.content | quote }}
