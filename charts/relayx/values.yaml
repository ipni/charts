# Name of the Deployment, Service, PodMonitor and the ConfigMap's prefix.
name: relayx

# Required: "<repository>" and "<tag>", where tag may carry a digest
# (main@sha256:...). No default, so a box can never run an image by accident.
image:
  repository: ghcr.io/ipni/relayx
  tag: ""
  # Empty uses the Kubernetes default.
  pullPolicy: ""

replicas: 1
# hostPath Pebble lock is exclusive. RollingUpdate starts a second pod that
# cannot Open the DB while the old pod still holds LOCK.
strategy:
  type: Recreate

# Selects the pods. A Deployment's selector is immutable, so changing this means
# deleting the Deployment.
selectorLabels:
  app: relayx

podSecurityContext: {}

# --pebblePath and --pebbleOptions have to match dataMountPath and pebbleOptions.
args:
  - serve
  - --delegate=pebble
  - --pebblePath=/data
  - --pebbleOptions=/pebble/pebble.options

# A list, because order is part of the pod template: reordering restarts relayx.
env: []

ports:
  - containerPort: 8080
    name: http

readinessProbe:
  tcpSocket:
    port: 8080
  initialDelaySeconds: 10
  failureThreshold: 3
  successThreshold: 1
  timeoutSeconds: 5
  periodSeconds: 10

resources: {}

# Flush remaining memtables then Close; 17T stores can take several minutes.
terminationGracePeriodSeconds: 600
# Recreate waits for terminationGracePeriodSeconds, then Open of the new pod.
progressDeadlineSeconds: 1800

# Host directory holding the Pebble store. Required.
dataPath: ""
dataPathType: DirectoryOrCreate
dataMountPath: /data

pebbleOptions:
  # Contents of pebble.options. Required.
  content: ""
  fileName: pebble.options
  mountPath: /pebble
  # Leave empty: the ConfigMap is named after a hash of its content, so changing
  # it restarts relayx. Set it only to adopt a running box without a restart;
  # while set, changing content does NOT restart relayx.
  configMapName: ""

service:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 8080
      targetPort: http

podMonitor:
  enabled: true
  path: /metrics
  port: http
