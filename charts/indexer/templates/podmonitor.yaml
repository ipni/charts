{{- if .Values.podMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "indexer.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "indexer.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  podMetricsEndpoints:
    - path: /metrics
      port: admin
  selector:
    matchLabels:
      app: indexer-single
{{- end }}
