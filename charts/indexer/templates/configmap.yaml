{{- if not .Values.config }}
{{- fail "config is required" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "indexer.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "indexer.labels" . | nindent 4 }}
data:
  config: {{ .Values.config | toPrettyJson | quote }}
