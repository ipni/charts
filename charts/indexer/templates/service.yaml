apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "indexer.labels" . | nindent 4 }}
spec:
  clusterIP: {{ .Values.service.clusterIP }}
  ports:
    {{- toYaml .Values.service.ports | nindent 4 }}
  selector:
    {{- toYaml .Values.selectorLabels | nindent 4 }}
  type: {{ .Values.service.type }}
