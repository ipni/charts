# Name of the Deployment, Service, PodDisruptionBudget and PodMonitor.
name: indexer

# Required: "<repository>" and "<tag>", where tag may carry a digest
# (main@sha256:...). No default, so a box can never run an image by accident.
image:
  repository: ghcr.io/ipni/storetheindex
  tag: ""
  pullPolicy: IfNotPresent

# One replica on purpose: the datastores on the host paths belong to one
# process, so the old pod has to stop before the new one starts.
replicas: 1
strategy:
  type: Recreate

# Selects the pods. A Deployment's selector is immutable, so changing this means
# deleting the Deployment.
selectorLabels:
  app: indexer-single

terminationGracePeriodSeconds: 10

podSecurityContext:
  runAsUser: 0
  fsGroup: 532

# Empty runs the image's default command, the daemon.
args: []

# Add or remove entries here; the chart adds none of its own. A box that sets
# env replaces this whole list, so it has to repeat the two paths, which match
# identity and configMountPath. A list, because order is part of the pod
# template: reordering restarts the indexer.
env:
  # When a panic happens, dump only the panicking goroutine. The indexer spawns
  # so many that the panic site is otherwise lost to log rotation.
  - name: GOTRACEBACK
    value: single
  - name: STORETHEINDEX_PRIV_KEY_PATH
    value: /identity/identity.key
  - name: STORETHEINDEX_PATH
    value: /config

envFrom: []

ports:
  - containerPort: 3004
    name: rx
  - containerPort: 3005
    name: carmirror
  - containerPort: 3000
    name: finder
  - containerPort: 3001
    name: ingest
  - containerPort: 3002
    name: admin

readinessProbe:
  httpGet:
    port: finder
    path: /health
  initialDelaySeconds: 10
  failureThreshold: 3
  successThreshold: 1
  timeoutSeconds: 5
  periodSeconds: 10

resources: {}

# The libp2p private key, from a Secret created outside this chart.
identity:
  # Required.
  secretName: ""
  mountPath: /identity
  keyFile: identity.key

# Host directories, by volume name. hostPath is required unless optional is
# true. mountPath has to match the directories in config.
storage:
  data-datastore:
    hostPath: ""
    mountPath: /data/datastore
    type: DirectoryOrCreate
  data-reverse-index:
    hostPath: ""
    mountPath: /data/reverse_index
    type: DirectoryOrCreate
  data-tmpstore:
    hostPath: ""
    mountPath: /data/tmpstore
    type: DirectoryOrCreate
  # Only on a box with a local CAR mirror.
  mirror:
    hostPath: ""
    mountPath: /mirror
    type: DirectoryOrCreate
    optional: true

# The storetheindex config file, as YAML; the chart renders it as JSON. Maps
# merge across values files, so a box only sets what differs. Required.
config: {}
configMountPath: /config

# Leave empty: the ConfigMap is named after a hash of its content, so changing
# it restarts the indexer. Set it only to compare with a Kustomize render;
# while set, changing config does NOT restart the indexer.
configMapName: ""

# Only expose admin if a route needs it: it also serves write and control
# endpoints.
service:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: rx
      port: 3004
      targetPort: rx
    - name: carmirror
      port: 3005
      targetPort: carmirror
    - name: finder
      port: 3000
      targetPort: finder
    - name: ingest
      port: 3001
      targetPort: ingest

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

podMonitor:
  enabled: true
  path: /metrics
  port: admin

# Anything else the pod needs, without changing the chart.
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
extraVolumes: []
extraVolumeMounts: []
