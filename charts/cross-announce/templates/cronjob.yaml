apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version }}
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  schedule: {{ .Values.schedule | quote }}
  suspend: {{ .Values.suspend }}
  concurrencyPolicy: {{ .Values.concurrencyPolicy }}
  startingDeadlineSeconds: {{ .Values.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.backoffLimit }}
      ttlSecondsAfterFinished: {{ .Values.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            {{- toYaml .Values.podLabels | nindent 12 }}
        spec:
          restartPolicy: {{ .Values.restartPolicy }}
          volumes:
            - name: src
              emptyDir: {}
          containers:
            - name: runner
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
                - name: AD_SOURCE
                  value: {{ required "source is required" .Values.source | quote }}
                - name: AD_TARGET
                  value: {{ required "target is required" .Values.target | quote }}
                - name: CODE_VERSION
                  value: {{ required "codeVersion is required" .Values.codeVersion | quote }}
              {{- with .Values.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              volumeMounts:
                - name: src
                  mountPath: {{ .Values.workDir }}
              command:
                {{- toYaml .Values.command | nindent 16 }}
              args:
                - {{ .Values.script | quote }}
