# Name of the CronJob.
name: cross-announce

# The script is not in the storetheindex image, so each run clones the repo and
# compiles it with this image.
image:
  repository: golang
  tag: "1.26"
  pullPolicy: IfNotPresent

schedule: "*/5 * * * *"

# Stops the schedule without removing the job, which can still be run by hand.
suspend: false

# Do not allow two runs to overlap: the second run is skipped.
concurrencyPolicy: Forbid
# A job that cannot start within this many seconds is dropped.
startingDeadlineSeconds: 300
successfulJobsHistoryLimit: 1
# KubeCronJobFailing counts the failed Jobs kept here (monitoring rules/jobs.yaml)
failedJobsHistoryLimit: 3
backoffLimit: 2
ttlSecondsAfterFinished: 86400
restartPolicy: OnFailure

podLabels:
  app: cross-announce

# Indexer to list providers from, as a URL. Required.
source: ""

# Ingest API of the local indexer, as a URL. Required.
target: ""

# Branch or tag of storetheindex to run the script from. Required.
codeVersion: ""

resources: {}

# Where the repo is cloned, an emptyDir. Has to match DEST in script.
workDir: /src

command:
  - /bin/bash
  - -c

# Reads AD_SOURCE, AD_TARGET and CODE_VERSION, set from the values above.
script: |
  set -euo pipefail

  REPO_URL="https://github.com/ipni/storetheindex"
  DEST="/src"

  # If the directory already exists (previous run that didn't clean up),
  # just update it; otherwise clone fresh.
  if [ -d "$DEST/.git" ]; then
    echo "Repo already present – pulling latest changes..."
    cd "$DEST"
    git fetch --depth=1 origin "$CODE_VERSION"
    git reset --hard "origin/$CODE_VERSION"
  else
    echo "Cloning $REPO_URL into $DEST ..."
    git clone --depth=1 --branch "$CODE_VERSION" "$REPO_URL" "$DEST"
  fi

  echo "Running go script..."
  cd "$DEST"
  # The script may need network access – ensure it has it.
  go run scripts/cross_announce/main.go --source "$AD_SOURCE" --target "$AD_TARGET"
